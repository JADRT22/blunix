name: Tests

# Roda a suíte em todo push e pull request para main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GTK4 + PyGObject (o pacote soberix importa gi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0

      - name: Instalar pytest
        run: python3 -m pip install --user --break-system-packages pytest

      - name: Rodar testes
        run: python3 -m pytest -q
