name: Tests

# Roda a suíte em todo push e pull request para main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GTK4 + PyGObject (o pacote soberix importa gi)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 xvfb

      - name: Instalar pytest
        run: python3 -m pip install --user --break-system-packages pytest

      # Xvfb: os smoke tests constroem a janela GTK real — teriam pego a
      # regressão v1.5.1 (app não abria) antes de publicar.
      - name: Rodar testes (com display virtual)
        run: xvfb-run -a python3 -m pytest -q
