name: Release

# Publica uma release com o AppImage anexado quando uma tag v* é enviada.
# (Mesmo modelo do Bloxstrap: release gerada por CI, nunca manual.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema (GTK4 + PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 wget

      - name: Instalar pytest
        run: python3 -m pip install --user --break-system-packages pytest

      - name: Rodar testes
        run: python3 -m pytest -q

      - name: Construir AppImage
        run: ./tools/build-appimage.sh

      - name: Publicar na GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Blunix-*.AppImage
          generate_release_notes: true
          body: |
            **Jeito fácil:** baixe o `Blunix-*.AppImage` abaixo, marque como
            executável (`chmod +x`) e dê duplo clique. Requer o Sober:
            `flatpak install flathub org.vinegarhq.Sober`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
