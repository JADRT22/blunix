name: Release

# Publica uma release com o AppImage anexado quando uma tag v* é enviada.
# (Mesmo modelo do Bloxstrap: release gerada por CI, nunca manual.)
#
# O corpo da release vem de duas fontes:
#   1. CHANGELOG.md — seção "## v<versão>" da tag publicada (estilo Bloxstrap)
#   2. fallback: instruções de instalação em inglês
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências do sistema (GTK4 + PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 wget

      - name: Instalar pytest
        run: python3 -m pip install --user --break-system-packages pytest

      - name: Rodar testes
        run: python3 -m pytest -q

      - name: Extrair changelog da versão
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 tools/extract_changelog.py "$VERSION" > release_notes.md \
            || printf '**Blunix %s**\n\n**Easy way:** download the `Blunix-*.AppImage` asset below, mark it\nas executable (`chmod +x`) and run it (double-click works too).\nRequires Sober: `flatpak install flathub org.vinegarhq.Sober`\n' "$VERSION" > release_notes.md
          cat release_notes.md

      - name: Construir AppImage
        run: ./tools/build-appimage.sh

      - name: Publicar na GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Blunix-*.AppImage
          generate_release_notes: true
          body_path: release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
